<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LIM Settings</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>body{font:16px system-ui;background:#141821;color:#eee;margin:28px}label{display:block;margin:18px 0 6px}input[type=text],input[type=password]{width:95%;padding:7px}button{padding:8px;margin:8px 5px 0 0}p{line-height:1.4}#status{color:#9ed8ff}</style></head>
<body><h1>LIM Settings</h1><p>First launch prepares Python. The editor opens when ready.</p>
<form id="settings"><label for="key">API key (blank keeps saved key)</label><input id="key" type="password" autocomplete="off">
<label><input id="vertex" type="checkbox"> Use Vertex AI Express</label>
<label for="watch">Recordings folder</label><input id="watch" type="text"><button type="button" id="chooseWatch">Choose folder</button>
<label for="ffmpeg">FFmpeg folder (blank uses PATH)</label><input id="ffmpeg" type="text"><button type="button" id="chooseFfmpeg">Choose folder</button>
<p>Auto-capture is off at launch. Enable it from the tray to upload and analyze new recordings; provider charges may apply.</p>
<button type="submit">Save settings</button><button type="button" id="forget">Remove saved key</button></form>
<p id="status" role="status"></p><script src="settings.js"></script></body></html>
